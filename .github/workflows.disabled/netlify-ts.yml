name: Publish TS on Netlify

on:
    push:
        branches: ['staging/ts-version']

jobs:
    publish:
        runs-on: ubuntu-latest

        # environment:
        #   name: ts version
        #   url: https://facit-ts.netlify.app/

        steps:
            - uses: actions/checkout@master

            - name: Publish 🚀
              uses: netlify/actions/cli@master
              with:
                  args: deploy --dir=site --functions=functions
              env:
                  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_FACIT_TS_SITE_ID }}
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN_2025 }}
