name: Publish on Netlify

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    publish:
        runs-on: ubuntu-latest

        environment:
            name: Master
            url: https://facit-master.netlify.app

        steps:
            - uses: actions/checkout@master

            - name: Publish 🚀
              uses: netlify/actions/cli@master
              with:
                  args: deploy --dir=site --functions=functions
              env:
                  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_MASTER_SITE_ID }}
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN_2025 }}
