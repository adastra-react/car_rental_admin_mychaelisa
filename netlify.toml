[build]
  command = "npm run build"
  publish = "build"

  [build.environment]
    NODE_VERSION = "20.19.4"
    CI = "false"
    DISABLE_ESLINT_PLUGIN = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[plugins]]
package = "@netlify/plugin-lighthouse"

  [plugins.inputs.settings]
  preset = "desktop" # Optionally run Lighthouse using a desktop configuration
